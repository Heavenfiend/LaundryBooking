name: laundry

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: laundry
      POSTGRES_PASSWORD: laundry
      POSTGRES_DB: laundry
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laundry -d laundry"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
      target: runtime
    environment:
      DATABASE_URL: postgresql+psycopg://laundry:laundry@db:5432/laundry
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me}
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Moscow}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000" # Swagger: http://localhost:8000/docs

  # Автотесты: docker compose run --rm tests
  # Работают в отдельной базе laundry_test, рабочие данные не трогают.
  tests:
    profiles: ["test"]
    build:
      context: ./backend
      target: test
    environment:
      DATABASE_URL: postgresql+psycopg://laundry:laundry@db:5432/laundry_test
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Moscow}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata:
